<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" fill="none">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8e6d2a"/>
      <stop offset="0.22" stop-color="#e9cf86"/>
      <stop offset="0.4" stop-color="#b38a35"/>
      <stop offset="0.58" stop-color="#f3e1a4"/>
      <stop offset="0.78" stop-color="#a07c31"/>
      <stop offset="1" stop-color="#e1c27a"/>
    </linearGradient>
    <g id="fleuron">
      <path d="M0 34 V 8 Q 0 0 8 0 H 34"/>
      <path d="M7 26 V 12 Q 7 7 12 7 H 26"/>
      <path d="M34 0 C 40 0, 42 6, 38 8 C 35 10, 32 6, 35 4"/>
      <path d="M0 34 C 0 40, 6 42, 8 38 C 10 35, 6 32, 4 35"/>
      <path d="M14 14 l7 7"/>
      <path d="M21 21 l3.5 -1.5 l1.5 -3.5 l-3.5 1.5 z M21 21 l-1.5 3.5 l-3.5 1.5 l1.5 -3.5 z"/>
      <circle cx="12" cy="12" r="1.6"/>
    </g>
    <g id="divider">
      <path d="M-62 0 H -10 M10 0 H 62"/>
      <path d="M0 -6 L 7 0 L 0 6 L -7 0 Z"/>
      <circle cx="-68" cy="0" r="2"/>
      <circle cx="68" cy="0" r="2"/>
    </g>
    <g id="art" stroke-linecap="round" stroke-linejoin="round">
      <!-- blind-tooled hinge groove by the spine -->
      <rect x="16" y="16" width="268" height="368" rx="3" stroke-width="1.6"/>
      <rect x="23" y="23" width="254" height="354" rx="2" stroke-width="0.8"/>
      <rect x="19.5" y="19.5" width="261" height="361" stroke-width="1.3" stroke-dasharray="0.1 4.2"/>
      <use href="#fleuron" transform="translate(29 29)" stroke-width="1.2"/>
      <use href="#fleuron" transform="translate(271 29) scale(-1 1)" stroke-width="1.2"/>
      <use href="#fleuron" transform="translate(29 371) scale(1 -1)" stroke-width="1.2"/>
      <use href="#fleuron" transform="translate(271 371) scale(-1 -1)" stroke-width="1.2"/>
      <use href="#divider" transform="translate(150 168)" stroke-width="1.2"/>
      <use href="#divider" transform="translate(150 326)" stroke-width="1.2"/>
      <!-- the medallion -->
      <g transform="translate(150 246)">
        <circle r="46" stroke-width="1.6"/>
        <circle r="40" stroke-width="0.8"/>
        <circle r="43" stroke-width="1.2" stroke-dasharray="0.1 3.6"/>
        <g stroke-width="1">
          <path d="M0 -58 l3 5 l-3 5 l-3 -5 z"/><path d="M0 58 l3 -5 l-3 -5 l-3 5 z"/>
          <path d="M-58 0 l5 3 l5 -3 l-5 -3 z"/><path d="M58 0 l-5 3 l-5 -3 l5 -3 z"/>
          <path d="M41 -41 l-1.5 5.5 l-4 -4 z"/><path d="M-41 -41 l1.5 5.5 l4 -4 z"/>
          <path d="M41 41 l-1.5 -5.5 l-4 4 z"/><path d="M-41 41 l1.5 -5.5 l4 4 z"/>
        </g>
        <path d="M-12 -15 L -27 0 L -12 15" stroke-width="4.2"/>
        <path d="M12 -15 L 27 0 L 12 15" stroke-width="4.2"/>
        <path d="M5 -20 L -5 20" stroke-width="4.2"/>
      </g>
    </g>
  </defs>
  <!-- the dark offset makes the gold look pressed into the leather -->
  <use href="#art" stroke="#05080f" stroke-opacity="0.75" transform="translate(0.6 1)"/>
  <use href="#art" stroke="url(#g)"/>
  <path d="M7 10 V 390" stroke="#05080f" stroke-opacity="0.5" stroke-width="2"/>
  <path d="M9.5 10 V 390" stroke="#4a5f8f" stroke-opacity="0.45" stroke-width="1"/>
</svg>
