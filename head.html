<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Cel-Shaded Head</title>
  <style>
    :root {
      --skin: #f6d2be;
      --skin-shadow: #e0a88e;
      --hair: #2b2d3a;
      --hair-hi: #50546a;
      --hair-lo: #15161e;
      --ink: #1a1a1b;
      --glasses: #111;
      --spark: #fff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse 70% 50% at 50% 42%, #eaeef3, transparent 68%),
        linear-gradient(158deg, #b7bfca, #cfd5dd 48%, #aab3c0);
    }

    .stage {
      width: 360px;
      height: 340px;
      position: relative;
    }

    .chibi {
      position: absolute;
      width: 300px;
      height: 300px;
      left: 50%;
      top: 54%;
      transform: translate(-50%, -50%);
    }

    .chibi > * { position: absolute; }

    /* ===== EARS ===== */
    .ear {
      width: 36px;
      height: 44px;
      background: var(--skin);
      border: 4px solid var(--ink);
      border-radius: 50%;
      top: 128px;
      z-index: 2;
    }
    .ear--l { left: 34px; }
    .ear--r { right: 34px; left: auto; }
    .ear::after {
      content: "";
      position: absolute;
      width: 12px;
      height: 17px;
      border: 3px solid var(--ink);
      border-color: var(--ink) transparent transparent;
      border-radius: 50%;
      top: 13px;
      opacity: 0.4;
    }
    .ear--l::after { left: 9px; }
    .ear--r::after { right: 9px; transform: scaleX(-1); }

    /* ===== FACE ===== */
    .face {
      width: 178px;
      height: 168px;
      left: 50%;
      top: 86px;
      transform: translateX(-50%);
      background: var(--skin);
      border: 4px solid var(--ink);
      border-radius: 50%;
      z-index: 4;
      overflow: hidden;
    }

    .face__shade {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        115deg,
        var(--skin-shadow) 0 32%,
        transparent 32.15%
      );
    }

    .face__brow-shadow {
      position: absolute;
      left: 12px;
      right: 12px;
      top: 0;
      height: 42px;
      background: var(--skin-shadow);
      opacity: 0.45;
      border-radius: 0 0 50% 50%;
    }

    /* ===== HAIR — low crown + left-swept lift ===== */
    .hair-shell {
      width: 190px;
      height: 100px;
      left: 50%;
      top: 48px;
      transform: translateX(-50%);
      background: var(--hair);
      border: 4px solid var(--ink);
      border-radius: 50% 50% 42% 42% / 85% 85% 20% 20%;
      z-index: 6;
      box-shadow: inset 0 -20px 0 -8px var(--hair-lo);
    }

    /* Main lift: big mass leaning viewer's left */
    .lift {
      background: var(--hair);
      border: 4px solid var(--ink);
      z-index: 10;
    }

    .lift--1 {
      width: 118px;
      height: 72px;
      top: 22px;
      left: 42px;
      border-radius: 70% 35% 55% 40%;
      transform: rotate(-42deg);
      box-shadow:
        inset -18px -8px 0 -6px var(--hair-hi),
        inset 10px 12px 0 -5px var(--hair-lo);
    }

    .lift--2 {
      width: 110px;
      height: 68px;
      top: 8px;
      left: 92px;
      border-radius: 55% 60% 35% 45%;
      transform: rotate(-18deg);
      z-index: 11;
      box-shadow: inset 0 -16px 0 -6px var(--hair-hi);
    }

    .lift--3 {
      width: 78px;
      height: 58px;
      top: 14px;
      left: 152px;
      border-radius: 40% 65% 45% 35%;
      transform: rotate(12deg);
      box-shadow: inset 10px -8px 0 -5px var(--hair-hi);
    }

    .lift--4 {
      width: 64px;
      height: 48px;
      top: 52px;
      left: 30px;
      border-radius: 60% 35% 50% 40%;
      transform: rotate(-55deg);
      z-index: 9;
      box-shadow: inset -10px 0 0 -4px var(--hair-lo);
    }

    .lift--5 {
      width: 54px;
      height: 44px;
      top: 44px;
      left: 198px;
      border-radius: 40% 60% 40% 50%;
      transform: rotate(28deg);
      z-index: 8;
    }

    /* Forehead fringe — rounded dips */
    .fringe {
      background: var(--hair);
      border: 4px solid var(--ink);
      z-index: 12;
      box-shadow: inset 0 12px 0 -5px var(--hair-lo);
    }

    .fringe--a {
      width: 54px;
      height: 44px;
      top: 92px;
      left: 74px;
      border-radius: 45% 50% 55% 40%;
      transform: rotate(-12deg);
    }

    .fringe--b {
      width: 60px;
      height: 50px;
      top: 86px;
      left: 114px;
      border-radius: 50% 48% 45% 50%;
      z-index: 13;
    }

    .fringe--c {
      width: 52px;
      height: 42px;
      top: 94px;
      left: 158px;
      border-radius: 48% 45% 40% 55%;
      transform: rotate(14deg);
    }

    .hi {
      background: var(--hair-hi);
      border-radius: 50%;
      z-index: 14;
    }
    .hi--a {
      width: 38px;
      height: 18px;
      top: 28px;
      left: 98px;
      transform: rotate(-18deg);
    }
    .hi--b {
      width: 28px;
      height: 14px;
      top: 20px;
      left: 140px;
      transform: rotate(8deg);
    }

    .sideburn {
      width: 18px;
      height: 36px;
      background: var(--hair);
      border: 4px solid var(--ink);
      top: 116px;
      z-index: 11;
    }
    .sideburn--l {
      left: 52px;
      border-radius: 40% 10% 55% 60%;
      border-right: 0;
      transform: rotate(6deg);
    }
    .sideburn--r {
      right: 52px;
      left: auto;
      border-radius: 10% 40% 60% 55%;
      border-left: 0;
      transform: rotate(-6deg);
    }

    /* ===== BROWS ===== */
    .brow {
      width: 36px;
      height: 9px;
      background: var(--ink);
      border-radius: 55% 55% 25% 25%;
      top: 124px;
      z-index: 15;
    }
    .brow--l { left: 80px; transform: rotate(-10deg); }
    .brow--r { right: 80px; left: auto; transform: rotate(10deg); }

    /* ===== EYES — large chibi circles ===== */
    .eye {
      width: 32px;
      height: 32px;
      background: var(--ink);
      border-radius: 50%;
      top: 142px;
      z-index: 14;
    }
    .eye--l { left: 86px; }
    .eye--r { right: 86px; left: auto; }

    .eye__lash {
      position: absolute;
      width: 36px;
      height: 7px;
      background: var(--ink);
      border-radius: 50% 50% 0 0;
      top: -3px;
      left: -2px;
    }

    .eye__spark {
      position: absolute;
      background: var(--spark);
      border-radius: 50%;
    }
    .eye__spark--lg {
      width: 10px;
      height: 10px;
      top: 5px;
      left: 5px;
    }
    .eye__spark--sm {
      width: 5px;
      height: 5px;
      bottom: 5px;
      right: 5px;
    }

    /* ===== GLASSES ===== */
    .glasses {
      width: 158px;
      height: 52px;
      left: 50%;
      top: 134px;
      transform: translateX(-50%);
      z-index: 16;
    }
    .glasses > * { position: absolute; }

    .lens {
      width: 66px;
      height: 50px;
      border: 7px solid var(--glasses);
      border-radius: 16px;
      background: transparent;
      top: 0;
    }
    .lens--l { left: 0; }
    .lens--r { right: 0; left: auto; }

    .bridge {
      width: 24px;
      height: 7px;
      background: var(--glasses);
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 2px;
    }

    .gshine {
      width: 16px;
      height: 4px;
      background: var(--spark);
      border-radius: 2px;
      top: 8px;
    }
    .gshine--l { left: 10px; }
    .gshine--r { left: 94px; }

    /* ===== NOSE / MOUTH ===== */
    .nose {
      width: 13px;
      height: 9px;
      border: 3px solid var(--ink);
      border-color: transparent transparent var(--ink);
      border-radius: 50%;
      top: 174px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 14;
    }

    .mouth {
      width: 24px;
      height: 11px;
      border: 3px solid var(--ink);
      border-color: transparent transparent var(--ink);
      border-radius: 50%;
      top: 190px;
      left: calc(50% + 7px);
      transform: translateX(-50%) rotate(-8deg);
      z-index: 14;
    }

    .mouth-tick {
      width: 3px;
      height: 6px;
      background: var(--ink);
      border-radius: 1px;
      top: 194px;
      left: calc(50% + 17px);
      transform: rotate(28deg);
      z-index: 14;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div
      class="chibi"
      role="img"
      aria-label="Cel-shaded chibi head with swept pompadour hair and thick glasses"
    >
      <div class="ear ear--l"></div>
      <div class="ear ear--r"></div>

      <div class="face">
        <div class="face__shade"></div>
        <div class="face__brow-shadow"></div>
      </div>

      <div class="hair-shell"></div>
      <div class="lift lift--1"></div>
      <div class="lift lift--2"></div>
      <div class="lift lift--3"></div>
      <div class="lift lift--4"></div>
      <div class="lift lift--5"></div>

      <div class="fringe fringe--a"></div>
      <div class="fringe fringe--b"></div>
      <div class="fringe fringe--c"></div>

      <div class="hi hi--a"></div>
      <div class="hi hi--b"></div>

      <div class="sideburn sideburn--l"></div>
      <div class="sideburn sideburn--r"></div>

      <div class="brow brow--l"></div>
      <div class="brow brow--r"></div>

      <div class="eye eye--l">
        <div class="eye__lash"></div>
        <div class="eye__spark eye__spark--lg"></div>
        <div class="eye__spark eye__spark--sm"></div>
      </div>
      <div class="eye eye--r">
        <div class="eye__lash"></div>
        <div class="eye__spark eye__spark--lg"></div>
        <div class="eye__spark eye__spark--sm"></div>
      </div>

      <div class="glasses">
        <div class="lens lens--l"></div>
        <div class="lens lens--r"></div>
        <div class="bridge"></div>
        <div class="gshine gshine--l"></div>
        <div class="gshine gshine--r"></div>
      </div>

      <div class="nose"></div>
      <div class="mouth"></div>
      <div class="mouth-tick"></div>
    </div>
  </div>
</body>
</html>
