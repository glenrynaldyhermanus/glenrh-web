server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Behind the TLS proxy, so redirects (/me -> /me/) must stay relative.
    absolute_redirect off;

    # Trust the visitor address the TLS proxy forwards from the private network,
    # so the notes rate limit counts visitors, not the proxy.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 1024;

    error_page 404 /404.html;

    # Sticky notes: notes-api writes, Nginx serves the latest ten as a file.
    # all.json, the full archive, stays private on the volume.
    # Looked up per request through Docker's DNS, so `nginx -t` and the site
    # itself still work while notes-api is down or not deployed yet.
    location = /api/notes {
        limit_except POST { deny all; }
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $notes_api http://notes-api:8080;
        proxy_pass $notes_api;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 4k;
    }

    location = /notes/top.json {
        alias /usr/share/nginx/notes/top.json;
        add_header Cache-Control "no-cache";
    }

    location ^~ /notes-api/ { return 404; }
    location ~ /\. { return 404; }

    location ~ ^/work/devant/?$   { return 301 /work/short-stories/#devant; }
    location ~ ^/work/cineflow/?$ { return 301 /work/mtix/; }

    # Pages, CSS and JS revalidate on every visit: ES module imports carry no ?v= query.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:webp|png|jpe?g|gif|ico|svg|glb|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
