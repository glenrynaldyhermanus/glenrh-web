<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seni CSS Murni: Karakter Glen</title>
<style>
  /* --- RESET & BACKGROUND --- */
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-color: #d1d5db; /* Warna background abu-abu terang */
    margin: 0;
    font-family: sans-serif;
  }

  /* KOTAK PEMBUNGKUS UTAMA (UNTUK MEMOSISIKAN KARAKTER) */
  .glen-container {
    width: 300px;
    height: 500px;
    position: relative;
  }

  /* --- DEFINISI WARNA (UNTUK MEMUDAHKAN PERUBAHAN) --- */
  .glen-container {
    --color-skin: #fcd5c9; /* Warna kulit Glen */
    --color-hair: #2c2c2c; /* Warna rambut hitam */
    --color-glasses: #1a1a1a; /* Warna bingkai kacamata */
    --color-shirt: #ffffff; /* Warna polo shirt putih */
    --color-jeans: #4a86b9; /* Warna celana jeans biru */
    --color-border: #111111; /* Warna garis tepi yang tegas */
  }

  /* SEMUA ELEMEN MEMILIKI POSISI ABSOLUT */
  .glen-container div {
    position: absolute;
    box-sizing: border-radius;
  }

  /* --- KEPALA & RAMBUT --- */

  .head {
    width: 160px;
    height: 140px;
    background-color: var(--color-skin);
    border-radius: 70px / 60px; /* Bentuk lonjong wajah */
    border: 4px solid var(--color-border);
    top: 60px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
  }

  .hair-main {
    width: 180px;
    height: 120px;
    background-color: var(--color-hair);
    border-radius: 90px / 60px;
    border: 4px solid var(--color-border);
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9; /* Di belakang wajah */
  }

  /* Poni samping (dibuat dengan bentuk lonjong yang diputar) */
  .hair-fringe {
    width: 60px;
    height: 80px;
    background-color: var(--color-hair);
    border-radius: 50%;
    border-left: 4px solid var(--color-border);
    top: 45px;
    left: 80px;
    transform: rotate(-30deg);
    z-index: 11; /* Di depan wajah */
  }

  /* --- WAJAH & KACAMATA --- */

  /* Bingkai Kacamata (Dibuat minimalis) */
  .glasses-bridge {
    width: 25px;
    height: 4px;
    background-color: var(--color-glasses);
    top: 60px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 13;
  }

  .glasses-frame {
    width: 65px;
    height: 45px;
    background-color: rgba(255, 255, 255, 0.1); /* Lensa transparan */
    border: 6px solid var(--color-glasses);
    border-radius: 12px;
    top: 35px;
    z-index: 12;
  }

  .glasses-frame.left {
    left: 10px;
  }

  .glasses-frame.right {
    right: 10px;
  }

  /* Mata (Disederhanakan menjadi titik) */
  .eye {
    width: 12px;
    height: 12px;
    background-color: #333;
    border-radius: 50%;
    top: 50px;
    z-index: 11;
  }

  .eye.left {
    left: 35px;
  }

  .eye.right {
    right: 35px;
  }

  /* Mulut */
  .mouth {
    width: 30px;
    height: 10px;
    border: 3px solid #333;
    border-top: none;
    border-radius: 0 0 15px 15px;
    top: 95px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 11;
  }

  /* --- TUBUH & PAKAIAN --- */

  .body {
    width: 100px;
    height: 130px;
    top: 190px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
  }

  /* Polo Shirt Putih */
  .shirt {
    width: 100px;
    height: 130px;
    background-color: var(--color-shirt);
    border: 4px solid var(--color-border);
    border-radius: 20px 20px 10px 10px;
    top: 0;
    z-index: 6;
  }

  /* Kerah Polo */
  .collar {
    width: 50px;
    height: 25px;
    background-color: var(--color-shirt);
    border: 4px solid var(--color-border);
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    border-radius: 50% 50% 0 0;
    z-index: 7;
  }

  /* Titik Logo minimalis di dada */
  .shirt-logo {
    width: 6px;
    height: 6px;
    background-color: #aaa;
    border-radius: 50%;
    top: 40px;
    left: 30px;
    z-index: 7;
  }

  /* Lengan (Dibuat sederhana) */
  .sleeve {
    width: 30px;
    height: 60px;
    background-color: var(--color-shirt);
    border: 4px solid var(--color-border);
    border-radius: 10px;
    top: 10px;
    z-index: 5;
  }

  .sleeve.left {
    left: -20px;
    transform: rotate(10deg);
  }

  .sleeve.right {
    right: -20px;
    transform: rotate(-10deg);
  }

  /* --- CELANA & KAKI --- */

  /* Celana Jeans Biru */
  .pants {
    width: 100px;
    height: 130px;
    background-color: var(--color-jeans);
    border: 4px solid var(--color-border);
    border-top: none; /* Menyambung ke baju */
    border-radius: 0 0 15px 15px;
    top: 110px; /* Tumpang tindih sedikit dengan baju */
    z-index: 5;
  }

  /* Celah kaki (menggunakan gradien untuk membuat celah di celana) */
  .pants::after {
    content: '';
    position: absolute;
    width: 4px;
    height: 70px;
    background-color: var(--color-border);
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
  }

  /* Sepatu (Disederhanakan menjadi blok) */
  .shoe {
    width: 45px;
    height: 20px;
    background-color: #222; /* Sepatu hitam */
    border: 4px solid var(--color-border);
    border-radius: 10px 10px 0 0;
    top: 235px;
    z-index: 4;
  }

  .shoe.left {
    left: 2px;
  }

  .shoe.right {
    right: 2px;
  }

</style>
</head>
<body>

  <!-- STRUKTUR HTML PURE CSS ART -->
  <div class="glen-container">
    
    <!-- Rambut Utama (Belakang) -->
    <div class="hair-main"></div>

    <!-- Kepala & Wajah -->
    <div class="head">
      <div class="hair-fringe"></div> <!-- Poni Depan -->
      
      <!-- Kacamata -->
      <div class="glasses-frame left"></div>
      <div class="glasses-frame right"></div>
      <div class="glasses-bridge"></div>
      
      <!-- Detail Wajah -->
      <div class="eye left"></div>
      <div class="eye right"></div>
      <div class="mouth"></div>
    </div>

    <!-- Tubuh -->
    <div class="body">
      <div class="sleeve left"></div>
      <div class="sleeve right"></div>
      
      <div class="shirt">
        <div class="collar"></div>
        <div class="shirt-logo"></div>
      </div>
      
      <div class="pants"></div>
      
      <div class="shoe left"></div>
      <div class="shoe right"></div>
    </div>

  </div>

</body>
</html>
